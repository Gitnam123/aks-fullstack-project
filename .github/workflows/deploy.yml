name: AKS Fullstack Deployment

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

env:
  AZURE_LOCATION: centralindia
  RESOURCE_GROUP: aks-fullstack-rg
  TF_STATE_RESOURCE_GROUP: aks-terraform-state-rg
  AKS_NAME: aks-fullstack
  ACR_NAME_PREFIX: aksfullstackacr
  IMAGE_TAG: ${{ github.sha }}

  ARM_USE_OIDC: true
  ARM_USE_AZUREAD: true
  ARM_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
  ARM_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
  ARM_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

jobs:

  authenticate:
    name: Stage 1 - Azure Authentication
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Verify Azure Login
        run: |
          az account show

  infrastructure:
    name: Stage 2 - Terraform Infrastructure
    runs-on: ubuntu-latest
    needs: authenticate

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Create Terraform State Resource Group
        run: |
          if ! az group show --name "$TF_STATE_RESOURCE_GROUP" >/dev/null 2>&1; then
            az group create \
              --name "$TF_STATE_RESOURCE_GROUP" \
              --location "$AZURE_LOCATION"
          fi

      - name: Create Terraform State Storage Account
        run: |
          if ! az storage account show \
            --resource-group "$TF_STATE_RESOURCE_GROUP" \
            --name aksfulltfstate2026 >/dev/null 2>&1; then

            az storage account create \
              --resource-group "$TF_STATE_RESOURCE_GROUP" \
              --name aksfulltfstate2026 \
              --location "$AZURE_LOCATION" \
              --sku Standard_LRS \
              --min-tls-version TLS1_2 \
              --allow-blob-public-access false
          fi

      - name: Wait for Terraform State Storage
        run: sleep 30

      - name: Get GitHub Actions Principal ID
        id: principal
        run: |
          PRINCIPAL_ID=$(az ad sp show \
            --id "$ARM_CLIENT_ID" \
            --query id \
            -o tsv)

          echo "principal_id=$PRINCIPAL_ID" >> "$GITHUB_OUTPUT"

      - name: Grant Terraform State Storage Access
        run: |
          STORAGE_ID=$(az storage account show \
            --resource-group "$TF_STATE_RESOURCE_GROUP" \
            --name aksfulltfstate2026 \
            --query id \
            -o tsv)

          EXISTING_ROLE=$(az role assignment list \
            --assignee "${{ steps.principal.outputs.principal_id }}" \
            --scope "$STORAGE_ID" \
            --role "Storage Blob Data Contributor" \
            --query "[0].id" \
            -o tsv)

          if [ -z "$EXISTING_ROLE" ]; then
            az role assignment create \
              --assignee-object-id "${{ steps.principal.outputs.principal_id }}" \
              --assignee-principal-type ServicePrincipal \
              --role "Storage Blob Data Contributor" \
              --scope "$STORAGE_ID"

            sleep 30
          fi

      - name: Create Terraform State Container
        run: |
          az storage container create \
            --account-name aksfulltfstate2026 \
            --name tfstate \
            --auth-mode login \
            2>/dev/null || true

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.13.3

      - name: Terraform Init
        working-directory: terraform
        run: terraform init -reconfigure

      - name: Terraform Format Check
        working-directory: terraform
        run: terraform fmt -check -recursive

      - name: Terraform Validate
        working-directory: terraform
        run: terraform validate

      - name: Terraform Plan
        working-directory: terraform
        run: |
          terraform plan \
            -var="postgres_admin_password=${{ secrets.POSTGRES_ADMIN_PASSWORD }}" \
            -var="github_actions_principal_id=${{ steps.principal.outputs.principal_id }}"

      - name: Terraform Apply
        working-directory: terraform
        run: |
          terraform apply \
            -auto-approve \
            -var="postgres_admin_password=${{ secrets.POSTGRES_ADMIN_PASSWORD }}" \
            -var="github_actions_principal_id=${{ steps.principal.outputs.principal_id }}"

  docker-build:
    name: Stage 3 - Docker Build
    runs-on: ubuntu-latest
    needs: infrastructure

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build API Image
        run: docker build -t aks-product-api:${IMAGE_TAG} ./api

      - name: Build UI Image
        run: docker build -t aks-product-ui:${IMAGE_TAG} ./ui

  push-acr:
    name: Stage 4 - Push Images to ACR
    runs-on: ubuntu-latest
    needs: docker-build

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Get ACR
        id: acr
        run: |
          ACR_NAME=$(az acr list \
            --resource-group "$RESOURCE_GROUP" \
            --query "[0].name" \
            -o tsv)

          if [ -z "$ACR_NAME" ]; then
            echo "ERROR: No ACR found"
            exit 1
          fi

          echo "name=$ACR_NAME" >> "$GITHUB_OUTPUT"

      - name: Login to ACR
        run: |
          az acr login --name "${{ steps.acr.outputs.name }}"

      - name: Build and Push API Image
        run: |
          docker build \
            -t "${{ steps.acr.outputs.name }}.azurecr.io/aks-product-api:${IMAGE_TAG}" \
            ./api

          docker push \
            "${{ steps.acr.outputs.name }}.azurecr.io/aks-product-api:${IMAGE_TAG}"

      - name: Build and Push UI Image
        run: |
          docker build \
            -t "${{ steps.acr.outputs.name }}.azurecr.io/aks-product-ui:${IMAGE_TAG}" \
            ./ui

          docker push \
            "${{ steps.acr.outputs.name }}.azurecr.io/aks-product-ui:${IMAGE_TAG}"

  aks-connect:
    name: Stage 5 - AKS Connection
    runs-on: ubuntu-latest
    needs: push-acr

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Connect to AKS
        run: |
          az aks get-credentials \
            --resource-group "$RESOURCE_GROUP" \
            --name "$AKS_NAME" \
            --admin \
            --overwrite-existing

      - name: Verify AKS
        run: |
          kubectl cluster-info
          kubectl get nodes

  deploy:
    name: Stage 6 - Kubernetes Deployment
    runs-on: ubuntu-latest
    needs: aks-connect

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Connect to AKS
        run: |
          az aks get-credentials \
            --resource-group "$RESOURCE_GROUP" \
            --name "$AKS_NAME" \
            --admin \
            --overwrite-existing

      - name: Get ACR
        id: acr
        run: |
          ACR_NAME=$(az acr list \
            --resource-group "$RESOURCE_GROUP" \
            --query "[0].name" \
            -o tsv)

          echo "server=$ACR_NAME.azurecr.io" >> "$GITHUB_OUTPUT"

      - name: Get PostgreSQL Host
        id: postgres
        run: |
          PG_NAME=$(az postgres flexible-server list \
            --resource-group "$RESOURCE_GROUP" \
            --query "[0].name" \
            -o tsv)

          PG_HOST=$(az postgres flexible-server show \
            --resource-group "$RESOURCE_GROUP" \
            --name "$PG_NAME" \
            --query "fullyQualifiedDomainName" \
            -o tsv)

          echo "host=$PG_HOST" >> "$GITHUB_OUTPUT"

      - name: Create Generated Kubernetes Manifests
        env:
          ACR_SERVER: ${{ steps.acr.outputs.server }}
          POSTGRES_HOST: ${{ steps.postgres.outputs.host }}
          POSTGRES_USERNAME: ${{ secrets.POSTGRES_ADMIN_USERNAME }}
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_ADMIN_PASSWORD }}
        run: |
          mkdir -p k8s-generated

          cp k8s/namespace.yaml k8s-generated/
          cp k8s/configmap.yaml k8s-generated/
          cp k8s/api-service.yaml k8s-generated/
          cp k8s/ui-service.yaml k8s-generated/
          cp k8s/ingress.yaml k8s-generated/

          sed \
            -e "s|ACR_LOGIN_SERVER/aks-product-api:IMAGE_TAG|${ACR_SERVER}/aks-product-api:${IMAGE_TAG}|g" \
            -e "s|POSTGRES_HOST_PLACEHOLDER|${POSTGRES_HOST}|g" \
            k8s/api-deployment.yaml \
            > k8s-generated/api-deployment.yaml

          sed \
            "s|ACR_LOGIN_SERVER/aks-product-ui:IMAGE_TAG|${ACR_SERVER}/aks-product-ui:${IMAGE_TAG}|g" \
            k8s/ui-deployment.yaml \
            > k8s-generated/ui-deployment.yaml

          cat > k8s-generated/secret.yaml <<EOF
          apiVersion: v1
          kind: Secret
          metadata:
            name: postgres-secret
            namespace: product-app
          type: Opaque
          stringData:
            DB_USER: "${POSTGRES_USERNAME}"
            DB_PASSWORD: "${POSTGRES_PASSWORD}"
            DB_HOST: "${POSTGRES_HOST}"
          EOF

      - name: Deploy
        run: |
          # 1. Create the namespace first
          kubectl apply -f k8s-generated/namespace.yaml

          # 2. Wait until the namespace is Active
          kubectl wait \
            --for=jsonpath='{.status.phase}'=Active \
            namespace/product-app \
            --timeout=60s

          # 3. Create ConfigMap and Secret
          kubectl apply -f k8s-generated/configmap.yaml
          kubectl apply -f k8s-generated/secret.yaml

          # 4. Deploy API
          kubectl apply -f k8s-generated/api-deployment.yaml
          kubectl apply -f k8s-generated/api-service.yaml

          # 5. Deploy UI
          kubectl apply -f k8s-generated/ui-deployment.yaml
          kubectl apply -f k8s-generated/ui-service.yaml

          # 6. Create Ingress
          kubectl apply -f k8s-generated/ingress.yaml

          # 7. Wait for API deployment
          kubectl rollout status deployment/api-deployment \
            -n product-app \
            --timeout=180s

          # 8. Wait for UI deployment
          kubectl rollout status deployment/ui-deployment \
            -n product-app \
            --timeout=180s

          # 9. Display deployed resources
          kubectl get all -n product-app

          # 10. Display Ingress
          kubectl get ingress -n product-app -o wide

  verify:
    name: Stage 7 - Verification
    runs-on: ubuntu-latest
    needs: deploy

    steps:
      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Connect to AKS
        run: |
          az aks get-credentials \
            --resource-group "$RESOURCE_GROUP" \
            --name "$AKS_NAME" \
            --admin \
            --overwrite-existing

      - name: Verify Namespace
        run: |
          kubectl get namespace product-app

      - name: Verify API Deployment
        run: |
          kubectl rollout status deployment/api-deployment \
            -n product-app \
            --timeout=180s

      - name: Verify UI Deployment
        run: |
          kubectl rollout status deployment/ui-deployment \
            -n product-app \
            --timeout=180s

      - name: Verify Pods
        run: |
          kubectl get pods -n product-app -o wide

      - name: Verify Services
        run: |
          kubectl get svc -n product-app

      - name: Verify Ingress
        run: |
          kubectl get ingress -n product-app -o wide

      - name: Final Verification
        run: |
          echo "===== Deployments ====="
          kubectl get deployments -n product-app

          echo "===== Pods ====="
          kubectl get pods -n product-app

          echo "===== Services ====="
          kubectl get svc -n product-app

          echo "===== Ingress ====="
          kubectl get ingress -n product-app -o wide

          echo "===== Deployment Verification Completed ====="