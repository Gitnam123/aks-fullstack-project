name: AKS Fullstack CI/CD

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

env:
  RESOURCE_GROUP: aks-fullstack-rg
  AKS_NAME: aks-fullstack
  TF_VERSION: "1.9.8"

jobs:

  # =========================
  # STAGE 1 - AZURE LOGIN
  # =========================
  azure-login:
    name: Stage 1 - Azure Login
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Verify Azure
        run: az account show


  # =========================
  # STAGE 2 - INFRASTRUCTURE
  # =========================
  terraform:
    name: Stage 2 - Terraform Infrastructure
    runs-on: ubuntu-latest
    needs: azure-login

    steps:
      - uses: actions/checkout@v4

      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Create Terraform Variables
        working-directory: terraform
        env:
          DB_PASSWORD: ${{ secrets.POSTGRES_ADMIN_PASSWORD }}
        run: |
          cat > terraform.auto.tfvars <<EOF
          location = "centralindia"
          resource_group_name = "aks-fullstack-rg"
          aks_name = "aks-fullstack"
          acr_name_prefix = "aksfullstackacr"
          postgres_name_prefix = "aksfullstackpg"
          postgres_admin_username = "${{ secrets.POSTGRES_ADMIN_USERNAME }}"
          postgres_admin_password = "${DB_PASSWORD}"
          github_repository = "Gitnam123/aks-fullstack-project"
          github_branch = "main"
          EOF

      - name: Bootstrap State
        working-directory: bootstrap
        run: |
          if az storage account show \
            --resource-group "$RESOURCE_GROUP" \
            --name aksfulltfstate2026 >/dev/null 2>&1
          then
            terraform init -reconfigure
          else
            terraform init -backend=false
            terraform fmt -recursive
            terraform validate
            terraform apply -auto-approve
            sleep 60
            terraform init -migrate-state -force-copy
          fi

      - name: Terraform Deploy
        working-directory: terraform
        run: |
          terraform fmt -recursive -check
          terraform init -reconfigure
          terraform validate
          terraform plan -out=tfplan
          terraform apply -auto-approve tfplan

      - name: Wait for RBAC
        run: sleep 60


  # =========================
  # STAGE 3 - DOCKER BUILD
  # =========================
  docker-build:
    name: Stage 3 - Docker Build
    runs-on: ubuntu-latest
    needs: terraform

    steps:
      - uses: actions/checkout@v4

      - name: Build API
        run: docker build -t aks-product-api:test ./api

      - name: Build UI
        run: docker build -t aks-product-ui:test ./ui


  # =========================
  # STAGE 4 - PUSH TO ACR
  # =========================
  push-acr:
    name: Stage 4 - Push Images
    runs-on: ubuntu-latest
    needs:
      - terraform
      - docker-build

    steps:
      - uses: actions/checkout@v4

      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Get ACR
        id: acr
        run: |
          ACR_NAME=$(az acr list \
            --resource-group "$RESOURCE_GROUP" \
            --query "[0].name" \
            -o tsv)

          echo "name=$ACR_NAME" >> "$GITHUB_OUTPUT"

      - name: Login to ACR
        run: |
          az acr login --name "${{ steps.acr.outputs.name }}"

      - name: Build and Push API
        run: |
          docker build \
            -t "${{ steps.acr.outputs.name }}.azurecr.io/aks-product-api:${GITHUB_SHA::7}" \
            ./api

          docker push \
            "${{ steps.acr.outputs.name }}.azurecr.io/aks-product-api:${GITHUB_SHA::7}"

      - name: Build and Push UI
        run: |
          docker build \
            -t "${{ steps.acr.outputs.name }}.azurecr.io/aks-product-ui:${GITHUB_SHA::7}" \
            ./ui

          docker push \
            "${{ steps.acr.outputs.name }}.azurecr.io/aks-product-ui:${GITHUB_SHA::7}"


  # =========================
  # STAGE 5 - AKS CONNECTION
  # =========================
  aks:
    name: Stage 5 - AKS Connection
    runs-on: ubuntu-latest
    needs: push-acr

    steps:
      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Connect to AKS
        run: |
          az aks get-credentials \
            --resource-group "$RESOURCE_GROUP" \
            --name "$AKS_NAME" \
            --admin \
            --overwrite-existing

          kubectl get nodes


  # =========================
  # STAGE 6 - KUBERNETES
  # =========================
  deploy:
    name: Stage 6 - Kubernetes Deployment
    runs-on: ubuntu-latest
    needs: aks

    steps:
      - uses: actions/checkout@v4

      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Connect to AKS
        run: |
          az aks get-credentials \
            --resource-group "$RESOURCE_GROUP" \
            --name "$AKS_NAME" \
            --admin \
            --overwrite-existing

      - name: Get ACR
        id: acr
        run: |
          ACR_NAME=$(az acr list \
            --resource-group "$RESOURCE_GROUP" \
            --query "[0].name" \
            -o tsv)

          echo "server=$ACR_NAME.azurecr.io" >> "$GITHUB_OUTPUT"

      - name: Get PostgreSQL Host
        id: postgres
        run: |
          PG_NAME=$(az postgres flexible-server list \
            --resource-group "$RESOURCE_GROUP" \
            --query "[0].name" \
            -o tsv)

          PG_HOST=$(az postgres flexible-server show \
            --resource-group "$RESOURCE_GROUP" \
            --name "$PG_NAME" \
            --query "fullyQualifiedDomainName" \
            -o tsv)

          echo "host=$PG_HOST" >> "$GITHUB_OUTPUT"

      - name: Create Namespace
        run: kubectl apply -f k8s/namespace.yaml

      - name: Create ConfigMap
        run: kubectl apply -f k8s/configmap.yaml

      - name: Create DB Secret
        env:
          DB_USER: ${{ secrets.POSTGRES_ADMIN_USERNAME }}
          DB_PASSWORD: ${{ secrets.POSTGRES_ADMIN_PASSWORD }}
          DB_HOST: ${{ steps.postgres.outputs.host }}
        run: |
          kubectl create secret generic postgres-secret \
            -n product-app \
            --from-literal=DB_HOST="$DB_HOST" \
            --from-literal=DB_USER="$DB_USER" \
            --from-literal=DB_PASSWORD="$DB_PASSWORD" \
            --dry-run=client -o yaml | kubectl apply -f -

      - name: Prepare Images
        run: |
          mkdir -p k8s-generated

          sed \
            "s|ACR_LOGIN_SERVER/aks-product-api:IMAGE_TAG|${{ steps.acr.outputs.server }}/aks-product-api:${GITHUB_SHA::7}|g" \
            k8s/api-deployment.yaml \
            > k8s-generated/api-deployment.yaml

          sed \
            "s|ACR_LOGIN_SERVER/aks-product-ui:IMAGE_TAG|${{ steps.acr.outputs.server }}/aks-product-ui:${GITHUB_SHA::7}|g" \
            k8s/ui-deployment.yaml \
            > k8s-generated/ui-deployment.yaml

          cp k8s/api-service.yaml k8s-generated/
          cp k8s/ui-service.yaml k8s-generated/
          cp k8s/ingress.yaml k8s-generated/

      - name: Deploy
        run: |
          kubectl apply -f k8s-generated/
          kubectl get all -n product-app


  # =========================
  # STAGE 7 - VERIFY
  # =========================
  verify:
    name: Stage 7 - Verification
    runs-on: ubuntu-latest
    needs: deploy

    steps:
      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Connect to AKS
        run: |
          az aks get-credentials \
            --resource-group "$RESOURCE_GROUP" \
            --name "$AKS_NAME" \
            --admin \
            --overwrite-existing

      - name: Verify
        run: |
          kubectl rollout status deployment/api-deployment \
            -n product-app --timeout=180s

          kubectl rollout status deployment/ui-deployment \
            -n product-app --timeout=180s

          kubectl get pods -n product-app
          kubectl get svc -n product-app
          kubectl get ingress -n product-app -o wide