name: AKS Full Stack CI/CD

on:
  push:
    branches:
      - main

  workflow_dispatch:

permissions:
  id-token: write
  contents: read

env:
  TF_IN_AUTOMATION: true
  ARM_USE_OIDC: true
  ARM_USE_AZUREAD: true

  ARM_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
  ARM_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
  ARM_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

  RESOURCE_GROUP: aks-fullstack-rg
  AKS_NAME: aks-fullstack


# ============================================================
# STAGE 1
# Azure Authentication
# ============================================================

jobs:

  azure-auth:
    name: "Stage 1 - Azure Authentication"
    runs-on: ubuntu-latest

    steps:

      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Verify Azure Login
        run: |
          az account show
          echo "Azure authentication successful."


# ============================================================
# STAGE 2
# Terraform Infrastructure
# ============================================================

  terraform:
    name: "Stage 2 - Terraform Infrastructure"
    runs-on: ubuntu-latest
    needs: azure-auth

    steps:

      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      # --------------------------------------------------------
      # Bootstrap Terraform Backend
      # --------------------------------------------------------

      - name: Check Terraform Backend
        id: backend
        shell: bash
        run: |
          if az storage account show \
            --resource-group "$RESOURCE_GROUP" \
            --name "aksfulltfstate2026" \
            > /dev/null 2>&1
          then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "Terraform backend already exists."
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "Terraform backend does not exist."
          fi

      - name: Initialize Bootstrap Without Backend
        if: steps.backend.outputs.exists == 'false'
        working-directory: bootstrap
        run: |
          terraform init -backend=false

      - name: Bootstrap Terraform Format
        if: steps.backend.outputs.exists == 'false'
        working-directory: bootstrap
        run: |
          terraform fmt -check

      - name: Bootstrap Terraform Validate
        if: steps.backend.outputs.exists == 'false'
        working-directory: bootstrap
        run: |
          terraform validate

      - name: Bootstrap Terraform Plan
        if: steps.backend.outputs.exists == 'false'
        working-directory: bootstrap
        run: |
          terraform plan -out=tfplan

      - name: Bootstrap Terraform Apply
        if: steps.backend.outputs.exists == 'false'
        working-directory: bootstrap
        run: |
          terraform apply -auto-approve tfplan

      - name: Wait For Storage RBAC
        if: steps.backend.outputs.exists == 'false'
        run: |
          echo "Waiting for Storage Blob Data Contributor role propagation..."
          sleep 45

      - name: Migrate Bootstrap State To Azure Storage
        if: steps.backend.outputs.exists == 'false'
        working-directory: bootstrap
        run: |
          terraform init -migrate-state -force-copy

      - name: Initialize Existing Bootstrap Backend
        if: steps.backend.outputs.exists == 'true'
        working-directory: bootstrap
        run: |
          terraform init -reconfigure

      # --------------------------------------------------------
      # Main Terraform
      # --------------------------------------------------------

      - name: Initialize Main Terraform
        working-directory: terraform
        run: |
          terraform init -reconfigure

      - name: Terraform Format Check
        working-directory: terraform
        run: |
          terraform fmt -check

      - name: Terraform Validate
        working-directory: terraform
        run: |
          terraform validate

      - name: Terraform Plan
        working-directory: terraform
        env:
          TF_VAR_postgres_admin_password: ${{ secrets.POSTGRES_ADMIN_PASSWORD }}
        run: |
          terraform plan -out=tfplan

      - name: Terraform Apply
        working-directory: terraform
        env:
          TF_VAR_postgres_admin_password: ${{ secrets.POSTGRES_ADMIN_PASSWORD }}
        run: |
          terraform apply -auto-approve tfplan

      - name: Terraform Outputs
        working-directory: terraform
        run: |
          terraform output


# ============================================================
# STAGE 3
# Docker Build
# ============================================================

  docker-build:
    name: "Stage 3 - Build Docker Images"
    runs-on: ubuntu-latest
    needs: terraform

    steps:

      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Get ACR Name
        shell: bash
        run: |
          ACR_NAME=$(az acr list \
            --resource-group "$RESOURCE_GROUP" \
            --query "[0].name" \
            --output tsv)

          if [ -z "$ACR_NAME" ]; then
            echo "ERROR: ACR was not found."
            exit 1
          fi

          echo "ACR_NAME=$ACR_NAME" >> "$GITHUB_ENV"

      - name: Get ACR Login Server
        shell: bash
        run: |
          ACR_LOGIN_SERVER=$(az acr show \
            --resource-group "$RESOURCE_GROUP" \
            --name "$ACR_NAME" \
            --query "loginServer" \
            --output tsv)

          if [ -z "$ACR_LOGIN_SERVER" ]; then
            echo "ERROR: ACR login server was not found."
            exit 1
          fi

          echo "ACR_LOGIN_SERVER=$ACR_LOGIN_SERVER" >> "$GITHUB_ENV"

      - name: Create Image Tag
        shell: bash
        run: |
          IMAGE_TAG="${GITHUB_SHA::7}"

          echo "IMAGE_TAG=$IMAGE_TAG" >> "$GITHUB_ENV"

          echo "Image Tag: $IMAGE_TAG"

      - name: Build API Image
        run: |
          docker build \
            -t "$ACR_LOGIN_SERVER/aks-product-api:$IMAGE_TAG" \
            ./api

      - name: Build UI Image
        run: |
          docker build \
            -t "$ACR_LOGIN_SERVER/aks-product-ui:$IMAGE_TAG" \
            ./ui

      - name: Verify Docker Images
        run: |
          docker images


# ============================================================
# STAGE 4
# Push Images To ACR
# ============================================================

  acr-push:
    name: "Stage 4 - Push Images To ACR"
    runs-on: ubuntu-latest
    needs: docker-build

    steps:

      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Get ACR Name
        shell: bash
        run: |
          ACR_NAME=$(az acr list \
            --resource-group "$RESOURCE_GROUP" \
            --query "[0].name" \
            --output tsv)

          echo "ACR_NAME=$ACR_NAME" >> "$GITHUB_ENV"

      - name: Get ACR Login Server
        shell: bash
        run: |
          ACR_LOGIN_SERVER=$(az acr show \
            --resource-group "$RESOURCE_GROUP" \
            --name "$ACR_NAME" \
            --query "loginServer" \
            --output tsv)

          echo "ACR_LOGIN_SERVER=$ACR_LOGIN_SERVER" >> "$GITHUB_ENV"

      - name: Create Image Tag
        shell: bash
        run: |
          IMAGE_TAG="${GITHUB_SHA::7}"
          echo "IMAGE_TAG=$IMAGE_TAG" >> "$GITHUB_ENV"

      - name: Login To ACR
        run: |
          az acr login --name "$ACR_NAME"

      - name: Build API Image
        run: |
          docker build \
            -t "$ACR_LOGIN_SERVER/aks-product-api:$IMAGE_TAG" \
            ./api

      - name: Build UI Image
        run: |
          docker build \
            -t "$ACR_LOGIN_SERVER/aks-product-ui:$IMAGE_TAG" \
            ./ui

      - name: Push API Image
        run: |
          docker push \
            "$ACR_LOGIN_SERVER/aks-product-api:$IMAGE_TAG"

      - name: Push UI Image
        run: |
          docker push \
            "$ACR_LOGIN_SERVER/aks-product-ui:$IMAGE_TAG"

      - name: Verify API Image
        run: |
          az acr repository show \
            --name "$ACR_NAME" \
            --image "aks-product-api:$IMAGE_TAG"

      - name: Verify UI Image
        run: |
          az acr repository show \
            --name "$ACR_NAME" \
            --image "aks-product-ui:$IMAGE_TAG"


# ============================================================
# STAGE 5
# AKS Connection
# ============================================================

  aks-connect:
    name: "Stage 5 - Connect To AKS"
    runs-on: ubuntu-latest
    needs: acr-push

    steps:

      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Get AKS Credentials
        run: |
          az aks get-credentials \
            --resource-group "$RESOURCE_GROUP" \
            --name "$AKS_NAME" \
            --admin \
            --overwrite-existing

      - name: Verify AKS Cluster
        run: |
          kubectl cluster-info

      - name: Verify AKS Nodes
        run: |
          kubectl get nodes -o wide


# ============================================================
# STAGE 6
# Kubernetes Deployment
# ============================================================

  kubernetes-deploy:
    name: "Stage 6 - Deploy Kubernetes Application"
    runs-on: ubuntu-latest
    needs: aks-connect

    steps:

      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Get AKS Credentials
        run: |
          az aks get-credentials \
            --resource-group "$RESOURCE_GROUP" \
            --name "$AKS_NAME" \
            --admin \
            --overwrite-existing

      # --------------------------------------------------------
      # Get ACR
      # --------------------------------------------------------

      - name: Get ACR Information
        shell: bash
        run: |
          ACR_NAME=$(az acr list \
            --resource-group "$RESOURCE_GROUP" \
            --query "[0].name" \
            --output tsv)

          ACR_LOGIN_SERVER=$(az acr show \
            --resource-group "$RESOURCE_GROUP" \
            --name "$ACR_NAME" \
            --query "loginServer" \
            --output tsv)

          echo "ACR_NAME=$ACR_NAME" >> "$GITHUB_ENV"
          echo "ACR_LOGIN_SERVER=$ACR_LOGIN_SERVER" >> "$GITHUB_ENV"

      # --------------------------------------------------------
      # Image Tag
      # --------------------------------------------------------

      - name: Create Image Tag
        shell: bash
        run: |
          IMAGE_TAG="${GITHUB_SHA::7}"
          echo "IMAGE_TAG=$IMAGE_TAG" >> "$GITHUB_ENV"

      # --------------------------------------------------------
      # PostgreSQL
      # --------------------------------------------------------

      - name: Get PostgreSQL Server
        shell: bash
        run: |
          POSTGRES_NAME=$(az postgres flexible-server list \
            --resource-group "$RESOURCE_GROUP" \
            --query "[0].name" \
            --output tsv)

          if [ -z "$POSTGRES_NAME" ]; then
            echo "ERROR: PostgreSQL server was not found."
            exit 1
          fi

          echo "POSTGRES_NAME=$POSTGRES_NAME" >> "$GITHUB_ENV"

      - name: Get PostgreSQL FQDN
        shell: bash
        run: |
          POSTGRES_FQDN=$(az postgres flexible-server show \
            --resource-group "$RESOURCE_GROUP" \
            --name "$POSTGRES_NAME" \
            --query "fullyQualifiedDomainName" \
            --output tsv)

          if [ -z "$POSTGRES_FQDN" ]; then
            echo "ERROR: PostgreSQL FQDN was not found."
            exit 1
          fi

          echo "POSTGRES_FQDN=$POSTGRES_FQDN" >> "$GITHUB_ENV"

      # --------------------------------------------------------
      # Namespace
      # --------------------------------------------------------

      - name: Deploy Namespace
        run: |
          kubectl apply \
            -f k8s/namespace.yaml

      # --------------------------------------------------------
      # PostgreSQL Secret
      # --------------------------------------------------------

      - name: Create PostgreSQL Secret
        run: |
          kubectl create secret generic postgres-secret \
            --namespace product-app \
            --from-literal=DB_HOST="$POSTGRES_FQDN" \
            --from-literal=DB_USER="${{ secrets.POSTGRES_ADMIN_USERNAME }}" \
            --from-literal=DB_PASSWORD="${{ secrets.POSTGRES_ADMIN_PASSWORD }}" \
            --dry-run=client \
            -o yaml | kubectl apply -f -

      # --------------------------------------------------------
      # ConfigMap
      # --------------------------------------------------------

      - name: Deploy ConfigMap
        run: |
          kubectl apply \
            -f k8s/configmap.yaml

      # --------------------------------------------------------
      # API
      # --------------------------------------------------------

      - name: Deploy API
        shell: bash
        run: |
          sed \
            -e "s|ACR_LOGIN_SERVER|$ACR_LOGIN_SERVER|g" \
            -e "s|IMAGE_TAG|$IMAGE_TAG|g" \
            k8s/api-deployment.yaml | kubectl apply -f -

      - name: Deploy API Service
        run: |
          kubectl apply \
            -f k8s/api-service.yaml

      # --------------------------------------------------------
      # UI
      # --------------------------------------------------------

      - name: Deploy UI
        shell: bash
        run: |
          sed \
            -e "s|ACR_LOGIN_SERVER|$ACR_LOGIN_SERVER|g" \
            -e "s|IMAGE_TAG|$IMAGE_TAG|g" \
            k8s/ui-deployment.yaml | kubectl apply -f -

      - name: Deploy UI Service
        run: |
          kubectl apply \
            -f k8s/ui-service.yaml

      # --------------------------------------------------------
      # Ingress
      # --------------------------------------------------------

      - name: Deploy Ingress
        run: |
          kubectl apply \
            -f k8s/ingress.yaml


# ============================================================
# STAGE 7
# Deployment Verification
# ============================================================

  verify:
    name: "Stage 7 - Verify Deployment"
    runs-on: ubuntu-latest
    needs: kubernetes-deploy

    steps:

      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Get AKS Credentials
        run: |
          az aks get-credentials \
            --resource-group "$RESOURCE_GROUP" \
            --name "$AKS_NAME" \
            --admin \
            --overwrite-existing

      # --------------------------------------------------------
      # Rollout Verification
      # --------------------------------------------------------

      - name: Wait For API Rollout
        run: |
          kubectl rollout status \
            deployment/api-deployment \
            --namespace product-app \
            --timeout=300s

      - name: Wait For UI Rollout
        run: |
          kubectl rollout status \
            deployment/ui-deployment \
            --namespace product-app \
            --timeout=300s

      # --------------------------------------------------------
      # Pods
      # --------------------------------------------------------

      - name: Verify Pods
        run: |
          kubectl get pods \
            --namespace product-app \
            -o wide

      # --------------------------------------------------------
      # Services
      # --------------------------------------------------------

      - name: Verify Services
        run: |
          kubectl get services \
            --namespace product-app

      # --------------------------------------------------------
      # Ingress
      # --------------------------------------------------------

      - name: Verify Ingress
        run: |
          kubectl get ingress \
            --namespace product-app

      # --------------------------------------------------------
      # Application Gateway
      # --------------------------------------------------------

      - name: Get Application Gateway Public IP
        shell: bash
        run: |
          APPGW_IP=$(az network public-ip show \
            --resource-group "$RESOURCE_GROUP" \
            --name "aks-appgw-public-ip" \
            --query "ipAddress" \
            --output tsv)

          echo "==============================================="
          echo "Application Gateway Public IP"
          echo "==============================================="
          echo "$APPGW_IP"
          echo "==============================================="

      # --------------------------------------------------------
      # Final Status
      # --------------------------------------------------------

      - name: Deployment Summary
        run: |
          echo "==============================================="
          echo "       AKS FULL STACK DEPLOYMENT"
          echo "==============================================="
          echo "Azure Authentication : SUCCESS"
          echo "Terraform            : SUCCESS"
          echo "Docker Build         : SUCCESS"
          echo "ACR Push             : SUCCESS"
          echo "AKS Connection       : SUCCESS"
          echo "Kubernetes Deploy    : SUCCESS"
          echo "Deployment Verify    : SUCCESS"
          echo "==============================================="