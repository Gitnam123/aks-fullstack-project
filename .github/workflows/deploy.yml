name: AKS Full Stack CI/CD

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

env:
  RESOURCE_GROUP: aks-fullstack-rg
  AKS_NAME: aks-fullstack
  ARM_USE_OIDC: true
  ARM_USE_AZUREAD: true
  TF_IN_AUTOMATION: true
  ARM_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
  ARM_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
  ARM_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

jobs:

  # ==========================================================
  # STAGE 1 - AZURE AUTHENTICATION
  # ==========================================================
  azure-auth:
    name: Stage 1 - Azure Authentication
    runs-on: ubuntu-latest

    steps:
      - uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - run: az account show


  # ==========================================================
  # STAGE 2 - TERRAFORM INFRASTRUCTURE
  # ==========================================================
  terraform:
    name: Stage 2 - Terraform Infrastructure
    runs-on: ubuntu-latest
    needs: azure-auth

    steps:
      - uses: actions/checkout@v4

      - uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - uses: hashicorp/setup-terraform@v3

      # Bootstrap state storage only if required
      - name: Bootstrap
        working-directory: bootstrap
        run: |
          if az storage account show \
            --resource-group "$RESOURCE_GROUP" \
            --name aksfulltfstate2026 > /dev/null 2>&1
          then
            terraform init -reconfigure
          else
            terraform init -backend=false
            terraform fmt -check
            terraform validate
            terraform plan -out=tfplan
            terraform apply -auto-approve tfplan
            sleep 30
            terraform init -reconfigure
          fi

      # Main Azure infrastructure
      - name: Terraform Apply
        working-directory: terraform
        env:
          TF_VAR_postgres_admin_password: ${{ secrets.POSTGRES_ADMIN_PASSWORD }}
        run: |
          terraform init -reconfigure
          terraform fmt -check
          terraform validate
          terraform plan -out=tfplan
          terraform apply -auto-approve tfplan


  # ==========================================================
  # STAGE 3 - DOCKER BUILD
  # ==========================================================
  docker-build:
    name: Stage 3 - Docker Build
    runs-on: ubuntu-latest
    needs: terraform

    steps:
      - uses: actions/checkout@v4

      - name: Build API
        run: docker build -t aks-product-api:${GITHUB_SHA::7} ./api

      - name: Build UI
        run: docker build -t aks-product-ui:${GITHUB_SHA::7} ./ui


  # ==========================================================
  # STAGE 4 - PUSH TO ACR
  # ==========================================================
  acr-push:
    name: Stage 4 - Push Images To ACR
    runs-on: ubuntu-latest
    needs: docker-build

    steps:
      - uses: actions/checkout@v4

      - uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Get ACR
        run: |
          ACR_NAME=$(az acr list \
            --resource-group "$RESOURCE_GROUP" \
            --query "[0].name" \
            -o tsv)

          ACR_LOGIN_SERVER=$(az acr show \
            --resource-group "$RESOURCE_GROUP" \
            --name "$ACR_NAME" \
            --query loginServer \
            -o tsv)

          echo "ACR_NAME=$ACR_NAME" >> "$GITHUB_ENV"
          echo "ACR_LOGIN_SERVER=$ACR_LOGIN_SERVER" >> "$GITHUB_ENV"

      - name: Login ACR
        run: az acr login --name "$ACR_NAME"

      - name: Build And Push API
        run: |
          docker build \
            -t "$ACR_LOGIN_SERVER/aks-product-api:${GITHUB_SHA::7}" ./api
          docker push \
            "$ACR_LOGIN_SERVER/aks-product-api:${GITHUB_SHA::7}"

      - name: Build And Push UI
        run: |
          docker build \
            -t "$ACR_LOGIN_SERVER/aks-product-ui:${GITHUB_SHA::7}" ./ui
          docker push \
            "$ACR_LOGIN_SERVER/aks-product-ui:${GITHUB_SHA::7}"


  # ==========================================================
  # STAGE 5 - AKS CONNECTION
  # ==========================================================
  aks-connect:
    name: Stage 5 - AKS Connection
    runs-on: ubuntu-latest
    needs: acr-push

    steps:
      - uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Connect AKS
        run: |
          az aks get-credentials \
            --resource-group "$RESOURCE_GROUP" \
            --name "$AKS_NAME" \
            --admin \
            --overwrite-existing

          kubectl get nodes


  # ==========================================================
  # STAGE 6 - KUBERNETES DEPLOYMENT
  # ==========================================================
  kubernetes-deploy:
    name: Stage 6 - Kubernetes Deployment
    runs-on: ubuntu-latest
    needs: aks-connect

    steps:
      - uses: actions/checkout@v4

      - uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Connect AKS
        run: |
          az aks get-credentials \
            --resource-group "$RESOURCE_GROUP" \
            --name "$AKS_NAME" \
            --admin \
            --overwrite-existing

      - name: Get ACR And PostgreSQL
        run: |
          ACR_NAME=$(az acr list \
            --resource-group "$RESOURCE_GROUP" \
            --query "[0].name" -o tsv)

          ACR_LOGIN_SERVER=$(az acr show \
            --resource-group "$RESOURCE_GROUP" \
            --name "$ACR_NAME" \
            --query loginServer -o tsv)

          POSTGRES_NAME=$(az postgres flexible-server list \
            --resource-group "$RESOURCE_GROUP" \
            --query "[0].name" -o tsv)

          POSTGRES_FQDN=$(az postgres flexible-server show \
            --resource-group "$RESOURCE_GROUP" \
            --name "$POSTGRES_NAME" \
            --query fullyQualifiedDomainName -o tsv)

          echo "ACR_LOGIN_SERVER=$ACR_LOGIN_SERVER" >> "$GITHUB_ENV"
          echo "POSTGRES_FQDN=$POSTGRES_FQDN" >> "$GITHUB_ENV"

      - name: Deploy Application
        run: |
          kubectl apply -f k8s/namespace.yaml

          kubectl create secret generic postgres-secret \
            -n product-app \
            --from-literal=DB_HOST="$POSTGRES_FQDN" \
            --from-literal=DB_USER="${{ secrets.POSTGRES_ADMIN_USERNAME }}" \
            --from-literal=DB_PASSWORD="${{ secrets.POSTGRES_ADMIN_PASSWORD }}" \
            --dry-run=client -o yaml | kubectl apply -f -

          kubectl apply -f k8s/configmap.yaml

          sed \
            -e "s|ACR_LOGIN_SERVER|$ACR_LOGIN_SERVER|g" \
            -e "s|IMAGE_TAG|${GITHUB_SHA::7}|g" \
            k8s/api-deployment.yaml | kubectl apply -f -

          kubectl apply -f k8s/api-service.yaml

          sed \
            -e "s|ACR_LOGIN_SERVER|$ACR_LOGIN_SERVER|g" \
            -e "s|IMAGE_TAG|${GITHUB_SHA::7}|g" \
            k8s/ui-deployment.yaml | kubectl apply -f -

          kubectl apply -f k8s/ui-service.yaml
          kubectl apply -f k8s/ingress.yaml


  # ==========================================================
  # STAGE 7 - VERIFICATION
  # ==========================================================
  verify:
    name: Stage 7 - Deployment Verification
    runs-on: ubuntu-latest
    needs: kubernetes-deploy

    steps:
      - uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Connect AKS
        run: |
          az aks get-credentials \
            --resource-group "$RESOURCE_GROUP" \
            --name "$AKS_NAME" \
            --admin \
            --overwrite-existing

      - name: Verify Deployment
        run: |
          kubectl rollout status deployment/api-deployment \
            -n product-app --timeout=300s

          kubectl rollout status deployment/ui-deployment \
            -n product-app --timeout=300s

          kubectl get pods -n product-app
          kubectl get services -n product-app
          kubectl get ingress -n product-app

      - name: Get Application Gateway IP
        run: |
          az network public-ip show \
            --resource-group "$RESOURCE_GROUP" \
            --name aks-appgw-public-ip \
            --query ipAddress \
            -o tsv