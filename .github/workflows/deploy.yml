name: AKS Full Stack CI/CD

on:
  push:
    branches:
      - main

  workflow_dispatch:

permissions:
  id-token: write
  contents: read

env:
  RESOURCE_GROUP: aks-fullstack-rg
  AKS_NAME: aks-fullstack

  ARM_USE_OIDC: true
  ARM_USE_AZUREAD: true
  TF_IN_AUTOMATION: true

  ARM_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
  ARM_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
  ARM_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

jobs:

  # ==========================================================
  # STAGE 1 - AZURE AUTHENTICATION
  # ==========================================================

  azure-auth:
    name: Stage 1 - Azure Authentication
    runs-on: ubuntu-latest

    steps:
      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Verify Azure
        run: az account show


  # ==========================================================
  # STAGE 2 - TERRAFORM INFRASTRUCTURE
  # ==========================================================

  terraform:
    name: Stage 2 - Terraform Infrastructure
    runs-on: ubuntu-latest
    needs: azure-auth

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      # Bootstrap backend already exists.
      # Initialize it using the Azure backend.
      - name: Initialize Bootstrap
        working-directory: bootstrap
        run: |
          terraform init -reconfigure
          terraform fmt -check
          terraform validate

      # Create/update all Azure infrastructure.
      - name: Terraform Infrastructure
        working-directory: terraform
        env:
          TF_VAR_postgres_admin_password: ${{ secrets.POSTGRES_ADMIN_PASSWORD }}
        run: |
          terraform init -reconfigure
          terraform fmt -check
          terraform validate
          terraform plan -out=tfplan
          terraform apply -auto-approve tfplan

      # Give Azure RBAC assignments time to propagate.
      - name: Wait For Azure RBAC
        run: sleep 45


  # ==========================================================
  # STAGE 3 - DOCKER BUILD
  # ==========================================================

  docker-build:
    name: Stage 3 - Docker Build
    runs-on: ubuntu-latest
    needs: terraform

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build API
        run: |
          docker build \
            -t aks-product-api:${GITHUB_SHA::7} \
            ./api

      - name: Build UI
        run: |
          docker build \
            -t aks-product-ui:${GITHUB_SHA::7} \
            ./ui


  # ==========================================================
  # STAGE 4 - PUSH IMAGES TO ACR
  # ==========================================================

  acr-push:
    name: Stage 4 - Push Images To ACR
    runs-on: ubuntu-latest
    needs: docker-build

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Get ACR Information
        shell: bash
        run: |
          ACR_NAME=$(az acr list \
            --resource-group "$RESOURCE_GROUP" \
            --query "[0].name" \
            --output tsv)

          if [ -z "$ACR_NAME" ]; then
            echo "ACR not found."
            exit 1
          fi

          ACR_LOGIN_SERVER=$(az acr show \
            --resource-group "$RESOURCE_GROUP" \
            --name "$ACR_NAME" \
            --query loginServer \
            --output tsv)

          echo "ACR_NAME=$ACR_NAME" >> "$GITHUB_ENV"
          echo "ACR_LOGIN_SERVER=$ACR_LOGIN_SERVER" >> "$GITHUB_ENV"

      - name: Login To ACR
        run: |
          az acr login --name "$ACR_NAME"

      - name: Build And Push API
        run: |
          docker build \
            -t "$ACR_LOGIN_SERVER/aks-product-api:${GITHUB_SHA::7}" \
            ./api

          docker push \
            "$ACR_LOGIN_SERVER/aks-product-api:${GITHUB_SHA::7}"

      - name: Build And Push UI
        run: |
          docker build \
            -t "$ACR_LOGIN_SERVER/aks-product-ui:${GITHUB_SHA::7}" \
            ./ui

          docker push \
            "$ACR_LOGIN_SERVER/aks-product-ui:${GITHUB_SHA::7}"

      - name: Verify Images
        run: |
          az acr repository show \
            --name "$ACR_NAME" \
            --image "aks-product-api:${GITHUB_SHA::7}"

          az acr repository show \
            --name "$ACR_NAME" \
            --image "aks-product-ui:${GITHUB_SHA::7}"


  # ==========================================================
  # STAGE 5 - AKS CONNECTION
  # ==========================================================

  aks-connect:
    name: Stage 5 - AKS Connection
    runs-on: ubuntu-latest
    needs: acr-push

    steps:
      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Connect To AKS
        run: |
          az aks get-credentials \
            --resource-group "$RESOURCE_GROUP" \
            --name "$AKS_NAME" \
            --admin \
            --overwrite-existing

          kubectl get nodes


  # ==========================================================
  # STAGE 6 - KUBERNETES DEPLOYMENT
  # ==========================================================

  kubernetes-deploy:
    name: Stage 6 - Kubernetes Deployment
    runs-on: ubuntu-latest
    needs: aks-connect

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Connect To AKS
        run: |
          az aks get-credentials \
            --resource-group "$RESOURCE_GROUP" \
            --name "$AKS_NAME" \
            --admin \
            --overwrite-existing

      - name: Get Azure Resources
        shell: bash
        run: |
          ACR_NAME=$(az acr list \
            --resource-group "$RESOURCE_GROUP" \
            --query "[0].name" \
            --output tsv)

          ACR_LOGIN_SERVER=$(az acr show \
            --resource-group "$RESOURCE_GROUP" \
            --name "$ACR_NAME" \
            --query loginServer \
            --output tsv)

          POSTGRES_NAME=$(az postgres flexible-server list \
            --resource-group "$RESOURCE_GROUP" \
            --query "[0].name" \
            --output tsv)

          if [ -z "$POSTGRES_NAME" ]; then
            echo "PostgreSQL server not found."
            exit 1
          fi

          POSTGRES_FQDN=$(az postgres flexible-server show \
            --resource-group "$RESOURCE_GROUP" \
            --name "$POSTGRES_NAME" \
            --query fullyQualifiedDomainName \
            --output tsv)

          echo "ACR_LOGIN_SERVER=$ACR_LOGIN_SERVER" >> "$GITHUB_ENV"
          echo "POSTGRES_FQDN=$POSTGRES_FQDN" >> "$GITHUB_ENV"

      - name: Deploy Namespace
        run: |
          kubectl apply -f k8s/namespace.yaml

      - name: Create PostgreSQL Secret
        run: |
          kubectl create secret generic postgres-secret \
            --namespace product-app \
            --from-literal=DB_HOST="$POSTGRES_FQDN" \
            --from-literal=DB_USER="${{ secrets.POSTGRES_ADMIN_USERNAME }}" \
            --from-literal=DB_PASSWORD="${{ secrets.POSTGRES_ADMIN_PASSWORD }}" \
            --dry-run=client \
            -o yaml | kubectl apply -f -

      - name: Deploy ConfigMap
        run: |
          kubectl apply -f k8s/configmap.yaml

      - name: Deploy API
        run: |
          sed \
            -e "s|ACR_LOGIN_SERVER|$ACR_LOGIN_SERVER|g" \
            -e "s|IMAGE_TAG|${GITHUB_SHA::7}|g" \
            k8s/api-deployment.yaml | kubectl apply -f -

      - name: Deploy API Service
        run: |
          kubectl apply -f k8s/api-service.yaml

      - name: Deploy UI
        run: |
          sed \
            -e "s|ACR_LOGIN_SERVER|$ACR_LOGIN_SERVER|g" \
            -e "s|IMAGE_TAG|${GITHUB_SHA::7}|g" \
            k8s/ui-deployment.yaml | kubectl apply -f -

      - name: Deploy UI Service
        run: |
          kubectl apply -f k8s/ui-service.yaml

      - name: Deploy Ingress
        run: |
          kubectl apply -f k8s/ingress.yaml


  # ==========================================================
  # STAGE 7 - VERIFICATION
  # ==========================================================

  verify:
    name: Stage 7 - Deployment Verification
    runs-on: ubuntu-latest
    needs: kubernetes-deploy

    steps:
      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Connect To AKS
        run: |
          az aks get-credentials \
            --resource-group "$RESOURCE_GROUP" \
            --name "$AKS_NAME" \
            --admin \
            --overwrite-existing

      - name: Verify API
        run: |
          kubectl rollout status \
            deployment/api-deployment \
            --namespace product-app \
            --timeout=300s

      - name: Verify UI
        run: |
          kubectl rollout status \
            deployment/ui-deployment \
            --namespace product-app \
            --timeout=300s

      - name: Verify Kubernetes
        run: |
          kubectl get pods -n product-app -o wide
          kubectl get services -n product-app
          kubectl get ingress -n product-app

      - name: Get Application Gateway IP
        run: |
          APPGW_IP=$(az network public-ip show \
            --resource-group "$RESOURCE_GROUP" \
            --name aks-appgw-public-ip \
            --query ipAddress \
            --output tsv)

          echo "Application Gateway Public IP: $APPGW_IP"